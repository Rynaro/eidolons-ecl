contract_version: "1.0"
from: orchestrator
to: gilgamesh
edge_origin: roster
performatives_allowed:
  - REQUEST
  - INFORM
  - ACKNOWLEDGE
artifacts:
  - kind: mission-contract
    schema_ref: ../schemas/per-eidolon/mission-contract.v1.json
    evidence_anchor_required: false
context_delta:
  token_budget_max: 3000
  required_handles: []
trust_level: standard
notes: >
  The orchestrator's initial mission dispatch to Gilgamesh, taken only via
  Dispatch Protocol Step-2(a) — no specialist scored >= tau and the mechanical
  presence-based predicate found the prompt actionable (methodology/cortex/
  dispatch-predicate.md). REQUEST is the ECL performative reserved for
  "orchestrator -> Eidolon: initial mission dispatch" (spec/ecl-2.1.md §2);
  INFORM covers supplementary mid-mission context; ACKNOWLEDGE covers a
  lightweight reply to an ESCALATE Gilgamesh raised on one of its own outbound
  handoff-request edges. Listed in roster: gilgamesh.handoffs.upstream contains
  orchestrator (R-006). `orchestrator` is a first-class reserved identity for
  `from`/`to`, not a closed-enum value — ECL v2.1 §1.1.3 (MUST), the
  handoff-contract.v1.json field description ("Sender Eidolon slug, or
  'orchestrator', 'human'"), and conformance gate E-5 all admit it explicitly.
  This is the first `orchestrator-to-*` contract in the corpus; every other
  shipped Eidolon's initial dispatch is presently undocumented as a discrete
  contract file and is implied by `handoffs.upstream` alone — Gilgamesh is the
  first member whose spec (R-006, R-034) requires it enumerated.
