contract_version: "1.0"
from: ramza
to: apivr
edge_origin: roster
performatives_allowed:
  - PROPOSE
  - INFORM
  - REFUSE
artifacts:
  - kind: spec
    schema_ref: ../schemas/per-eidolon/spec.v1.json
    required_sections:
      - stories
      - validation_gates
      - agent_hints
      - given_when_then
    evidence_anchor_required: false
context_delta:
  token_budget_max: 6000
  required_handles: []
trust_level: standard
notes: >
  RAMZA hands off a decision-ready specification for APIVR-Δ (the
  conservative opt-in fallback coder) to implement. Listed in roster:
  apivr.handoffs.upstream contains ramza. Same dual-format spec as
  ramza-to-vivi.yaml; used when the host lacks Vivi's closed loop. Mirrors
  spectra-to-apivr.yaml under the new default planner seat.
