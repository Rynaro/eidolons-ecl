[project]
name = "eidolons-ecl-sdk"
version = "1.2.0"
description = "ECL Python reference SDK"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0.2",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
eidolons-ecl = "eidolons_ecl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidolons_ecl"]

[tool.hatch.version]
path = "src/eidolons_ecl/version.py"

[tool.uv]
dev-dependencies = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["eidolons_ecl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
