emitter: spectra-4.3.1
recipient: apivr
date: 2026-05-13
scout_inputs:
  - .atlas-scout/v2.0-phase2c/scout-report.md
  - .atlas-scout/v2.0-phase2c/findings.md
spec_anchors:
  - spec/ecl-1.2.md#1.1.1
  - spec/ecl-1.2.md#1.2
  - spec/ecl-1.2.md#6.1
  - spec/ecl-1.2.md#6.3
  - spec/ecl-1.2.md#7.3
  - docs/threat-model.md#T1
  - docs/threat-model.md#T2
  - docs/threat-model.md#T3

decisions:
  - id: DECISION-S0
    gap: major-bump-justification
    outcome: v2.0.0-MAJOR
    why: S-3 gate plus receiver_authorization changes receiver semantics; v1.x receivers cannot anticipate; SemVer MAJOR trigger.
    alternatives:
      - v1.3-minor-additive-only
      - v2.0-strict-MUST-fail-S-3-today
    consequences:
      - 12 schema $id segments bump /v1.0.0/ -> /v2.0.0/
      - spec/ecl-2.0.md ships alongside ecl-{1.0,1.1,1.2}.md
      - ECL_VERSION 1.2 -> 2.0 in one jump

  - id: DECISION-S1
    gap: GAP-E
    outcome: three-field-ISE-subset
    fields:
      - ise.assertion_grade
      - ise.provenance
      - ise.receiver_authorization
    dropped:
      - who-am-I (already covered by from.eidolon + roster)
      - who-vouches (deferred to v2.1 — nested envelope signature chain)
    threat_anchors:
      - T3-inter-agent-trust-exploitation
      - T2-prompt-infection (indirect, via receiver_authorization blast-radius)
    consequences:
      - schemas/envelope.v2.json adds $defs.ise
      - new gates S-1 MUST, S-2 MUST, S-3 SHOULD
      - ISE block OPTIONAL on emit; required-when-present sub-fields apply
      - constraints.trust_level retained unchanged

  - id: DECISION-S2
    gap: GAP-A
    outcome: NO-contract-bump
    why: envelope-only PR scope; no consumer pulls on default_ise; avoids DC-2-redux unused-field drift.
    consequences:
      - handoff-contract.v1.json $id bumps to /v2.0.0/ but schema content unchanged
      - new drift-register entry D-02 filed

  - id: DECISION-S3
    gap: GAP-B
    outcome: NO-py-verifier-this-PR
    why: scope discipline; Py SDK has migrate+a2a+types only today; verifier is a feature, not a bump-coupled requirement.
    forge_candidate: true
    consequences:
      - types.py extended with IseBlock TypedDict
      - new drift-register entry D-04 filed

  - id: DECISION-S4
    gap: GAP-C
    outcome: migrate-stays-v1.0
    why: back-fill semantics; emitting unverified ISE on legacy artefacts is worse than omission.
    consequences:
      - reference-sdk/py/src/eidolons_ecl/migrate/backfill.py unchanged
      - reference-sdk/py/src/eidolons_ecl/a2a_bridge/translator.py unchanged
      - test_migrate.py v1.0 assertions unchanged
      - docs/migration-v1-to-v2.md clarifies back-fill vs forward-migration

  - id: DECISION-S5
    gap: GAP-D
    outcome: bundle-DC-3-in-this-PR
    why: DC-3 overdue (pre-v1.2.0 trigger missed); envelopeVerify.ts already heavily edited for ajv bundle.
    consequences:
      - DC-3 retires as D-03 in drift register
      - two describe.skip tests un-skip in envelopeVerify.test.ts

  - id: DECISION-S6
    gap: GAP-F
    outcome: ship-templates-envelope-v2-example.json
    why: §1.3 worked-example pattern is load-bearing for per-Eidolon adoption.
    consequences:
      - templates/envelope-v2-example.json (NEW)
      - templates/envelope-example.json (v1.0) retained

  - id: DECISION-S7
    gap: GAP-G
    outcome: direct-1.1-to-2.0
    why: no consumer depends on TS reading exactly "1.2"; gratuitous interim release rejected.
    consequences:
      - reference-sdk/ts/src/version.ts:11 becomes "2.0"
      - CHANGELOG calls out the skip explicitly

  - id: DECISION-S8
    gap: GAP-H
    outcome: I-5-stays-SHOULD
    why: promoting to MUST inside §7.3 12-month window breaks live v1.x emitters legitimately combining trust_level=high + sha256.
    promotion_target: v2.1
    consequences:
      - conformance/lib/integrity.sh:117-124 unchanged
      - spec ecl-2.0.md §6.1 [PROMOTION-CANDIDATE] note
      - CHANGELOG "Deferred" subsection records the call

  - id: DECISION-S9
    finding: FINDING-010
    outcome: fix-in-this-PR
    why: latent P1 bug rejecting v1.1/v1.2 envelopes today; atomic with v2.0 expansion edit.
    consequences:
      - conformance/lib/envelope.sh:38-40 regex becomes "1.0|1.0.*|1.1|1.1.*|1.2|1.2.*|2.0|2.0.*"
      - CHANGELOG [2.0.0] Fixed subsection records regression

  - id: DECISION-S10
    finding: FINDING-015
    outcome: aliased-to-DECISION-S7
    note: tracebility-only

  - id: DECISION-S11
    finding: FINDING-016
    outcome: aliased-to-DECISION-S3
    note: tracebility-only

ise_field_schema:
  $defs:
    ise:
      type: object
      additionalProperties: false
      required: [assertion_grade]
      properties:
        assertion_grade:
          type: string
          enum: [unverified, self-attested, validated, human-reviewed]
        provenance:
          type: object
          additionalProperties: false
          required: [methodology_version]
          properties:
            methodology_version:
              type: string
              pattern: "^[a-z][a-z0-9-]*-\\d+\\.\\d+\\.\\d+$"
            tool_surface:
              type: array
              items: { type: string }
              maxItems: 32
            lateral_consults:
              type: array
              items:
                type: object
                required: [eidolon, performative]
                properties:
                  eidolon: { type: string }
                  performative:
                    type: string
                    enum: [INFORM, REQUEST, QUERY, INFORM-RESULT, INFORM-FAILURE, COMMIT, REJECT, ACK, CANCEL, SUBSCRIBE]
              maxItems: 8
        receiver_authorization:
          type: object
          additionalProperties: false
          properties:
            auto_route:  { type: boolean, default: true  }
            auto_merge:  { type: boolean, default: false }
            auto_deploy: { type: boolean, default: false }

conformance_gates:
  - id: E-3
    status: UPDATED
    level: MUST
    surface: conformance/lib/envelope.sh:38-40
    regex: "^(1\\.[012]|2\\.0)(\\.\\d+)?$"
    closes: [FINDING-010]
  - id: E-3.compat
    status: NEW
    level: INFO
    surface: conformance/lib/envelope.sh
    when: envelope_version matches v1.x AND verifier mode = v2
    emits: "v1.x envelope accepted under v2.0 receiver, §7.3 window valid through 2027-05-13"
  - id: S-1
    status: NEW
    level: MUST
    name: ISE_BLOCK_SHAPE
    surface: conformance/lib/ise.sh (NEW)
    check: "If ise present, validates against schemas/envelope.v2.json#/$defs/ise"
  - id: S-2
    status: NEW
    level: MUST
    name: ISE_AUTHZ_HONORED
    surface: [conformance/lib/ise.sh, reference-sdk/ts/src/envelopeVerify.ts]
    check: "Receiver MUST NOT auto-{route,merge,deploy} when corresponding ise.receiver_authorization.* = false"
  - id: S-3
    status: NEW
    level: SHOULD-WARN
    name: ISE_REQUIRED_AT_HIGH
    surface: [conformance/lib/ise.sh, reference-sdk/ts/src/envelopeVerify.ts]
    check: "If trust_level=high AND ise absent -> warn"
    promotion_candidate: v2.1-MUST
  - id: I-5
    status: UNCHANGED-LEVEL
    level: SHOULD-WARN
    note: per DECISION-S8

migration:
  envelope_version_regex_v2: "^(1\\.[012]|2\\.0)(\\.\\d+)?$"
  required_on_v2_within_window:
    envelope.ise: optional
    envelope.ise.assertion_grade: required-when-block-present
    envelope.ise.provenance: optional
    envelope.ise.receiver_authorization: optional
  warn_surface_for_v1x_under_v2:
    - E-3.compat INFO (non-blocking)
    - S-3 WARN if v1.x also carries trust_level=high
  tooling:
    migrate_backfill: unchanged-stays-v1.0
    a2a_translator: unchanged-stays-v1.0
    new_doc: docs/migration-v1-to-v2.md
  drift_register_changes:
    - id: D-01
      action: retire-DC-1
      finding: FINDING-024
    - id: D-02
      action: file-new
      topic: ISE-inheritance-from-contract-defaults
      reason: DECISION-S2 deferral
    - id: D-03
      action: retire-DC-3
      finding: FINDING-025
    - id: D-04
      action: file-new
      topic: python-envelope-verifier
      reason: DECISION-S3 deferral

scenarios:
  - id: S7.1
    name: emit-v2-with-all-ISE-fields
    expect: [E-3-PASS, S-1-PASS, I-1-PASS]
  - id: S7.2
    name: emit-v2-missing-ISE-conformant
    expect: [E-3-PASS, S-1-N/A, S-3-N/A]
  - id: S7.3
    name: emit-v2-high-trust-ISE-absent
    expect: [E-3-PASS, C-1-PASS, S-3-WARN, I-5-WARN-maybe]
  - id: S7.4
    name: receive-v1.x-under-v2.0
    expect: [E-3-PASS, E-3.compat-INFO]
  - id: S7.5
    name: receive-v2.0-under-v1.2-verifier
    expect: [E-3-FAIL]
    note: documents asymmetric §7.3 contract; v1.x not required to accept v2.0
  - id: S7.6
    name: I-5-path-under-v2.0
    expect: [I-5-WARN, S-3-WARN-also-if-ise-absent]
  - id: S7.7
    name: contract-validation-no-default_ise
    expect: [contract-validation-PASS, D-02-records-deferral]
  - id: S7.8
    name: receiver-authorization-MUST-S-2
    expect: [S-2-FAIL-if-auto-deploy-attempted, errors-array-populated]

