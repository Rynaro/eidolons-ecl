      - reference-sdk/py/src/eidolons_ecl/migrate/heuristics.py
      - reference-sdk/py/tests/test_migrate.py
      - reference-sdk/py/tests/fixtures/legacy-project/
    files_to_modify:
      - reference-sdk/py/src/eidolons_ecl/__main__.py  # add migrate subcommand
    heuristics:
      - "*scout-report*.md → atlas, scout-report"
      - "*completion-report*.md → apivr, apivr-completion-report"
      - "*root-cause-report*.md → vigil, root-cause-report"
      - "*reasoning-report*.md → forge, reasoning-report"
      - "*chronicle*.md → idg, chronicle"
    idempotence:
