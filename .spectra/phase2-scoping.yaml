        stories: [S2.3.b, "DC-1-promotion-in-drift-register"]
      - wave: IV
        mode: serial
        action: "Phase 2.C finalization — tag v2.0.0; release assets include spec/ecl-2.0.md + migration guide"

container_constraint:
  base_image: python:3.12-slim
  layout: reference-sdk/py/{Dockerfile.dev, compose.yml, Makefile}
  make_targets:
    install: "uv sync --frozen"
    build: "uv build + zipapp bundle"
    test: "uv run pytest"
    lint: "uv run ruff check + ruff format --check"
    typecheck: "uv run mypy src"
    check: "install + build + test + lint + typecheck (CI parity)"
  host_pollution_forbidden:
    - python (host)
    - pip (host)
    - uv (host)
    - pytest (host)
    - ruff (host)
    - mypy (host)
  named_volume: ecl-py-sdk-uv-cache  # warm cache between compose runs

backward_compat_invariants:
  - "v1.0 envelopes valid under v1.1 receivers (already true)"
  - "v1.0 + v1.1 envelopes valid under v1.2 receivers (Phase 2.A/2.B do not touch envelope semantics)"
  - "v1.x envelopes valid under v2.0 receivers for 12 months per §7.3"
  - "v1.x envelopes lacking envelope.ise function under v2.x receivers (v1 fallback)"
  - "schema $id at v1.0.0 remains valid; v2.0.0 $id coexists"
  - "bash SDK at v1.1.x in-tree through Phase 2.A/2.B; v2.0.x at Phase 2.C"
  - "TS SDK at v1.1.x in-tree through Phase 2.A/2.B; v2.0.x at Phase 2.C"
  - "HMAC at trust_level=high: RECOMMENDED in v1.1/v1.2 (warn I-5 exit 4); MUST in v2.0 (fail I-5 exit 2)"
  - "migration path: emitters using trust_level=high + sha256 must switch to hmac-sha256 OR downgrade trust_level before adopting envelope_version=2.0"

cross_repo_risks:
  - id: R-P2-1
    risk: "composition-drift CI flaky due to GH release asset download race"
    likelihood: medium
    mitigation: "pin tag exactly; use gh release download with retry; .pyz is small (<200KB)"
  - id: R-P2-2
    risk: "A2A spec evolves while Phase 2.B in flight; vendored schema invalidates"
    likelihood: low
    mitigation: "vendor schema pinned to specific A2A version; future PR adopts newer A2A"
  - id: R-P2-3
    risk: "ISE field semantics diverge between arXiv paper and downstream implementers"
    likelihood: medium
    mitigation: "§6.5 quotes ISE paper normative language verbatim where possible; receiver-side interpretation tracked as drift entries"
  - id: R-P2-4
    risk: "Python tier ramps slower than single-maintainer capacity (R-F-4)"
    likelihood: medium
    mitigation: "Phase 2.A largest; defer Phase 2.B to v1.3.0 if needed; Phase 2.C on independent timeline"
  - id: R-P2-5
    risk: "schema $id bump breaks external ajv consumers hard-coding v1.0.0 URIs"
    likelihood: low-medium
    mitigation: "migration guide enumerates affected $ids; 12-month §7.3 window keeps v1 $ids resolvable"
  - id: R-P2-6
    risk: "cross-org token-scope edge case for eidolons CI reading eidolons-ecl releases"
    likelihood: low
    mitigation: "default GITHUB_TOKEN has cross-repo read on public repos; both repos public; PAT or deploy key if either ever private"
  - id: R-P2-7
    risk: "HMAC promotion breaks v1.x downstream Eidolons at v2.0 adoption"
    likelihood: medium
    mitigation: "v2.0 envelope_version adoption is opt-in per Eidolon (§7.2); migration guide gives explicit path; v1.x envelopes still valid under v2.0 receivers"

out_of_scope_phase_2:
  - "npm + pip publish (separate release PRs)"
  - "A2A Task lifecycle / streaming / authentication (Phase 3)"
  - "cross-thread eval aggregation (Phase 3)"
  - "auto-thread inference in migration tool (Phase 3)"
  - "runtime engine for automatic envelope emission (Phase 3)"
  - "GUI/TUI envelope inspector (Phase 3)"
