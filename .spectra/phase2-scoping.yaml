---
spec_meta:
  eidolon: spectra
  version: 4.2.11
  kind: spec
  status: assemble
  confidence: 0.90
  trance_tier: G3-evaluator-optimizer
  refine_cycles_used: 1
  created_at: "2026-05-11T00:00:00Z"
  target_repos:
    - Rynaro/eidolons-ecl
    - Rynaro/eidolons
  parent_roadmap: /Users/henrique/workspace/oss/agents/eidolons/.spectra/harness-roadmap.md
  parent_section: "Phase 2 — ECL v2.0"
  precedents:
    - /Users/henrique/workspace/oss/agents/eidolons-ecl/.spectra/ts-sdk-port.md
    - /Users/henrique/workspace/oss/agents/eidolons-ecl/.spectra/v1.1-spec-bump.md
  stories_in_scope: [S2.1, S2.2, S2.3, S2.4, S2.5]
  sub_phases: [phase-2.A, phase-2.B, phase-2.C]

clarify:
  who:
    - role: "Phase 2.A subagents"
      type: APIVR-Δ
      model: sonnet
      isolation: worktree
      stories: [S2.A.0, S2.1, S2.5]
    - role: "Phase 2.B subagents"
      type: APIVR-Δ
      model: sonnet
      isolation: worktree
      stories: [S2.2, S2.4]
    - role: "Phase 2.C APIVR family"
      type: APIVR-Δ
      model: sonnet
      isolation: worktree
      stories: [S2.3.a, S2.3.c-bash, S2.3.c-ts, S2.3.c-py]
    - role: "Phase 2.C IDG"
      type: IDG
      mode: synthesis-only
      stories: [S2.3.b]
    - role: parent
      responsibilities:
        - run validation gates
        - open PRs
        - tag v1.2.0 / v1.2.x / v2.0.0 post-merge

  what:
    summary: >
      Phase 2 of the harness roadmap across three sub-phases:
      v1.2.0 (foundational Python tier + composition generator),
      v1.2.x or v1.3.0 (additive migration tool + A2A bridge),
      v2.0.0 (ISE trust-hierarchy fields + HMAC MUST promotion + schema $id bump).

  why: >
    Turns ECL from "spec + bash + TS SDK" into a production-grade harness with
    measurable coordination quality, audit-lineage back-fill, defense-in-depth
    trust hierarchy, cross-org A2A interop, and deterministic methodology
    generation. The version split keeps backward-compat cheap for adopters who
    only want the additive value (v1.2) while reserving the v2.0 envelope for
    the one real shape change (ISE fields).

  constraints:
    - container_first: "all pip/pytest/ruff/mypy/build inside reference-sdk/py/ dev container"
    - container_base_image: "python:3.12-slim"
    - backward_compat:
        v10_under_v11: "still valid"
        v10_v11_under_v12: "still valid"
        v10_v11_v12_under_v20: "valid for 12 months per §7.3"
    - lock_step_versioning: "all SDKs move together on minor per docs/tech-choice.md:42-45"
    - license: "Apache-2.0 across every new artefact"
    - read_only_a2a: "S2.4 bridge has no server runtime, no inbound listener"
    - deterministic_outputs:
        s2_5_generator: "byte-identical re-run on identical inputs (gated)"
    - no_eval_or_exec: "yaml.safe_load only; no dynamic code execution"
    - ci_gate_updates_at_version_bumps:
        - .github/workflows/conformance.yml
        - .github/workflows/release.yml

decisions:
  - id: DECISION-P2-1
    title: "Version strategy"
    chosen: "split: v1.2 for additive stories (S2.1/S2.2/S2.4/S2.5); v2.0 for ISE (S2.3)"
    rejected:
      - id: option-a
        title: "all Phase 2 → v2.0"
        reason: "overpays; SDK-tier additions don't need a major bump"
      - id: option-c
        title: "ISE made additive → all v1.2"
        reason: "under-prices schema $id bump per DC-1 drift register trigger"
    rationale_summary: >
      Apply spec/ecl-1.1.md §7.1 SemVer rules rigorously. S2.1/S2.2/S2.4/S2.5
      are pure additions (SDK + tooling, no spec/schema change) → MINOR. S2.3
      adds OPTIONAL envelope fields AND bumps schema $ids AND promotes HMAC at
      trust_level=high from RECOMMENDED to MUST → triggers the MAJOR rule per
      DC-1 promotion semantics + receiver-mandating security posture.
    artefacts_affected:
      - ECL_VERSION file
      - spec/ecl-2.0.md (new)
      - schemas/envelope.v2.json (new)
      - docs/migration-v1-to-v2.md (new)
      - docs/drift-register.md (D-01 promoted)

  - id: DECISION-P2-2
    title: "Sub-phase decomposition"
    chosen: "three sub-phases (2.A foundation / 2.B additions / 2.C break)"
    rejected:
      - id: single-pr
        reason: "3-5x Phase 1.B; review cost binding"
      - id: five-prs
        reason: "over-decomposed; S2.1+S2.5 share scaffolding"
      - id: foundation-additions-break-with-s2_5-in-2B
        reason: "S2.5 too small to anchor its own slot; co-lives naturally with S2.A.0/S2.1"
    sub_phases:
      - id: phase-2.A
        stories: [S2.A.0, S2.1, S2.5]
        branch: feat/v1.2.0-py-sdk-and-composition-gen
        tag: v1.2.0
        effort: large
        rationale: "greenfield Python tier; container scaffold; cross-repo touchpoint at Rynaro/eidolons"
      - id: phase-2.B
        stories: [S2.2, S2.4]
        branch: feat/v1.2.x-migration-and-a2a
        tag: v1.2.1
        tag_fallback: v1.3.0
        effort: medium
        rationale: "two additive Python modules on existing scaffold; A2A is well-scoped read-only"
      - id: phase-2.C
        stories: [S2.3]
        sub_stories: [S2.3.a, S2.3.b, S2.3.c-bash, S2.3.c-ts, S2.3.c-py]
        branch: feat/v2.0.0-ise-fields
        tag: v2.0.0
        effort: medium
        rationale: "only v2.0-shaped change; small surface but major-bump discipline + cross-SDK mirrors"

  - id: DECISION-P2-3
    title: "A2A bridge repo strategy"
    chosen: "subdirectory reference-sdk/py/src/eidolons_ecl/a2a_bridge/"
    rejected:
      - id: sibling-repo
        title: "eidolons-ecl-a2a-bridge sibling repo"
        reason: "breaks lock-step versioning; forces pip-resolution surface; not a separate methodology, just a translator tier"
    reversal_trigger: "A2A bridge grows runtime requirements that contradict library-only posture (e.g., HTTP server requirement); revisit per docs/tech-choice.md R-F-1"

  - id: DECISION-P2-4
    title: "S2.5 cross-repo strategy"
    chosen: "option-b: generator lives in eidolons-ecl; invoked from eidolons CI via vendored .pyz bundle"
    rejected:
      - id: option-a
        title: "auto-merging PR from eidolons-ecl CI to eidolons"
        reason: "cross-org auto-merge fragile; trigger ordering awkward; security concession on token scope"
      - id: option-c
        title: "manual maintainer command"
        reason: "cannot satisfy 'byte-deterministic' harness-roadmap acceptance gate; drift inevitable"
    mechanism:
      - "eidolons-ecl publishes dist/eidolons-ecl-sdk.bundle.pyz at v1.2.0 GH release"
      - "Rynaro/eidolons .github/workflows/composition-drift.yml downloads pyz by pinned tag"
      - "workflow runs python3 pyz compose-gen --contracts $TMP --out /tmp/regen.md"
      - "workflow diffs against HEAD's methodology/composition.md; fails on drift"
      - "no auto-merge; maintainer regenerates manually as part of any contracts/ change"
    files_affected_eidolons_ecl:
      - reference-sdk/py/src/eidolons_ecl/compose_gen/render.py
      - reference-sdk/py/src/eidolons_ecl/compose_gen/templates/composition.md.j2
      - reference-sdk/py/tests/test_compose_gen.py
      - Makefile  # build-vendor-py target
      - .github/workflows/release.yml  # attaches .pyz to v1.2.0 release
    files_affected_eidolons:
      - .github/workflows/composition-drift.yml  # new
      - methodology/composition.md  # replaced with generated output
      - methodology/composition.md.template  # local copy of Jinja2 template

  - id: DECISION-P2-5
    title: "Python packaging"
    chosen:
      build_backend: hatch (hatchling)
      dependency_resolver: uv
      test_runner: pytest
      linter_formatter: ruff
      type_checker: mypy
      vendor_bundle_tool: zipapp (stdlib)
      container_base: python:3.12-slim
    rejected:
      - id: setuptools_pip_tox_black
        reason: "old stack; per-tool config sprawl"
      - id: poetry
        reason: "slower resolver than uv; less PEP-compliant; idiosyncratic lockfile"
      - id: pdm
        reason: "smaller community than uv+hatch; valid alternative"
      - id: pyinstaller
        reason: "over-engineered; platform-specific build; stdlib zipapp sufficient for pure-Python scope"
    distribution:
      primary: "pip install eidolons-ecl-sdk (PyPI; separate release PR)"
      secondary: "vendor-as-single-file .pyz attached to GH release; used by Rynaro/eidolons CI per DECISION-P2-4"

  - id: DECISION-P2-6
    title: "S2.3 schema $id bump trigger"
    chosen: "bump to v2.0.0 in new envelope.v2.json file; closes DC-1"
    rationale: "DC-1 in docs/drift-register.md:170-191 named 'first additive schema field' as bump trigger; ISE fields are that trigger"
    filename_convention:
      - "schemas/envelope.v1.json stays in-tree (12-month §7.3 compatibility window)"
      - "schemas/envelope.v2.json is new (adds ise object under $defs)"
      - "$id at v2.0.0 URI: https://github.com/Rynaro/eidolons-ecl/blob/main/schemas/envelope.v2.json"
    other_schemas:
      - file: schemas/performative.v1.json
        v2_action: "no change; v1 stays canonical at v2.0"
      - file: schemas/handoff-contract.v1.json
        v2_action: "no change at v2.0; bump in future v2.x if contract shape changes"
      - file: schemas/context-delta.v1.json
        v2_action: "no change at v2.0"
      - file: schemas/handoff-event.v1.json
        v2_action: "no change at v2.0"
      - file: schemas/_base-profile.v1.json
        v2_action: "no change at v2.0"
    drift_register_update:
      promotion: "DC-1 → D-01"
      status: promoted
      conformance_gate: E-3
      target_version_closed: v2.0.0

clarify_subquestions:
  - q: "ECL_VERSION file value at end of Phase 2?"
    a: "2.0 (at Phase 2.C tag). Phase 2.A bumps 1.1→1.2; Phase 2.B stays at 1.2; Phase 2.C bumps 1.2→2.0."
  - q: "Python SDK ECL_VERSION_TARGET constant?"
    a: '"1.2" at Phase 2.A landing; "2.0" at Phase 2.C landing (lock-step per docs/tech-choice.md:42-45)'
  - q: "Python eval framework consumes TS SDK output?"
    a: "No. TS and Py are independent peers; both write the same JSONL trace format; eval reads JSONL regardless of writer."
  - q: "S2.4 read-only adapter only, no server runtime — confirm?"
    a: "Confirmed. Two modes: emit Agent Card (pure file output); translate A2A Message → ECL envelope (pure transformation). No HTTP server, no listener, no daemon."
  - q: "S2.5 deterministic output (byte-identical re-run)?"
    a: "Confirmed via: LC_ALL=C sorted contract filenames; yaml.safe_load; Jinja2 trim_blocks/lstrip_blocks; no timestamps; explicit \\n line endings; gate G-S2.5-Determinism runs 3x and asserts SHA-256 equality."

