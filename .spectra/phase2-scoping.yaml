trance_sequencing:
  phase-2.A:
    waves:
      - wave: I
        mode: serial
        stories: [S2.A.0]
      - wave: II
        mode: parallel
        stories: [S2.1, S2.5]
        isolation: "all but one use isolation: worktree per memory rule"
      - wave: III
        mode: serial
        action: "Phase 2.A finalization — tag v1.2.0; attach .pyz bundle to GH release"
  phase-2.B:
    waves:
      - wave: I
        mode: parallel
        stories: [S2.2, S2.4]
        isolation: "all but one use isolation: worktree"
      - wave: II
        mode: serial
