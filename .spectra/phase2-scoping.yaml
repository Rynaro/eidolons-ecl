          - README.md  # spec anchor bump
          - CHANGELOG.md  # add [2.0.0]
          - docs/drift-register.md  # promote DC-1 → D-01
        spec_edits:
          - section: header
            change: "Version: 1.1 → 2.0; Published: <merge-date>"
          - section: §1.1.1
            change: 'envelope_version regex ^1\.[01](\.\d+)?$ → ^[12]\.\d+(\.\d+)?$'
          - section: §1.2
            change: "add row: ise | object | Trust hierarchy per §6.5"
          - section: §6.1
            change: "hmac-sha256 row: RECOMMENDED → MUST at trust_level=high"
          - section: §6.2.6
            change: "I-5 level: SHOULD/warn (exit 4) → MUST/fail (exit 2) when trust_level=high + sha256"
          - section: §6.5 (new)
            change: "ISE trust hierarchy normative subsection (5 sub-sections)"
          - section: §7.1
            change: "note v2.0 ships envelope.v2.json with $id bumped; references D-01"
          - section: §7.3
            change: "v2.0 receivers accept v1.x for 12 months"
          - section: Citations
            change: "add arXiv ISE paper reference"
        ise_field_definition:
          location: "envelope.v2.json $defs.ise"
          shape:
            type: object
            properties:
              trust_hierarchy:
                type: array
                items:
                  source: "envelope | contract | payload | system"
                  level: "system | developer | user"
                  scope: string
              segment_priority: string
          semantics: "envelope.ise is OPTIONAL; receivers MAY ignore (v1.x fallback); v2-aware receivers SHALL apply hierarchy"

      - id: S2.3.b
