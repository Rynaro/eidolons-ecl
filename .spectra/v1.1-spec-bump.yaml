    - 2. S1.3    # threat-model.md, anchored against spec/ecl-1.1.md
    - 3. S1.5    # drift-register.md, anchored against spec/ecl-1.1.md
    - 4. S1.4.b  # bash conformance gate
    - 5. S1.4.c  # TS SDK warn integration
    - 6. CHANGELOG.md  # final v1.1.0 entry pass
  parallelizable_pairs:
