# Run the bats conformance suite + worked-example chains on every push and PR.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats, shellcheck, jq, yq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats shellcheck jq
          # Install mikefarah yq (Go binary) — Ubuntu's apt-yq is the python
          # variant which has different invocation; the Go variant is what
          # the lib code targets first.
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: shellcheck conformance scripts and SDK
        run: |
          find conformance reference-sdk examples -name '*.sh' -print0 \
            | xargs -0 shellcheck -x -S error

      - name: Validate JSON files
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*' -not -path './examples/*/.eidolons/*'); do
            jq empty "$f"
          done

      - name: Validate YAML contracts
        run: |
          for f in contracts/*.yaml; do
            yq eval '.' "$f" >/dev/null
          done

      - name: SPEC.md symlink resolves to spec/ecl-1.1.md
        run: |
          test "$(readlink SPEC.md)" = "spec/ecl-1.1.md"

      - name: ECL_VERSION matches latest spec file
        run: |
          ver="$(cat ECL_VERSION | tr -d '[:space:]')"
          test -f "spec/ecl-${ver}.md"

      - name: Run bats suite
        run: |
          bats conformance/tests/conformance.bats

      - name: Run atlas-spectra-apivr chain example
        run: |
          bash examples/atlas-spectra-apivr-chain/run.sh

      - name: Run apivr-vigil escalation example
        run: |
          bash examples/apivr-vigil-escalation/run.sh
